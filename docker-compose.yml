services:
  db:
    image: postgres:alpine
    hostname: localhost
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: db_passwor
      POSTGRES_USER: db_user
      POSTGRES_DB: db_valo
    volumes:
      - pgdata:/var/lib/postgresql/
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  pgdata:
